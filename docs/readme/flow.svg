<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 768" width="1200" height="768" role="img" aria-labelledby="t d">
  <title id="t">How a call connects</title>
  <desc id="d">1. The channel's kind 30078 pin names one SFU URL. 2. The browser fetches /info. 3. It opens the /rpc WebSocket. 4. The SFU sends a challenge. 5. The browser signs kind 22242. 6. The SFU checks the operator, allow.json and trusted follows, or rejects with 4403. 7. mediasoup RPC sets up transports. 8. Media flows as DTLS-SRTP over UDP straight to the SFU. 9. The SFU publishes kind 31313 discovery and kind 31314 room status.</desc>
